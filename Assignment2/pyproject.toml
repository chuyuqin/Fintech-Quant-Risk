[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-quant-risk"
version = "0.2.0"
description = "Reusable quantitative risk methods for FinTech 545"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scipy>=1.11,<2", "matplotlib>=3.8,<4", "reportlab>=4,<5"]

[tool.setuptools.packages.find]
where = ["."]
include = ["quant_risk*"]
