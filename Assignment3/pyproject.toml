[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech545-assignment3"
version = "1.0.0"
description = "Reproducible option pricing, portfolio risk, and factor attribution"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "matplotlib>=3.8", "reportlab>=4.0"]

[tool.setuptools.packages.find]
include = ["quant_risk*"]
